name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只發佈網頁需要的檔案。tests、README、.github 等都不會進到 _site。
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html style.css mask.js http.js kucgu.js challenges.js api-console.js app.js challenges-ui.js _site/

      # index.html 引用的本機檔案必須都在 _site 裡，且不可用 / 開頭的絕對路徑。
      - name: Check site files
        run: |
          if grep -nE '(src|href)="/[^/]' _site/index.html; then
            echo "發現以 / 開頭的絕對路徑，專案頁網址會壞掉" >&2
            exit 1
          fi
          grep -oE '(src|href)="[^"#:]+"' _site/index.html | sed -E 's/^(src|href)="//; s/"$//' | while read -r f; do
            test -f "_site/$f" || { echo "缺少檔案：$f" >&2; exit 1; }
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
